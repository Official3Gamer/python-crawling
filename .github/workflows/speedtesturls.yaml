name: Run URL Generation Script

on:
  workflow_dispatch: # Allows you to manually trigger the script from the Actions tab

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the repository code
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step 2: Set up the Python environment
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Step 3: Install required third-party libraries
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tqdm

    # Step 4: Run the script
    # Assumes your script file is named 'generate_data.py' in the root directory
    - name: Run Script
      run: python generate_data.py
