name: Run and Upload URL Chunks

on:
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the repository code
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step 2: Set up Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Step 3: Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tqdm

    # Step 4: Run the script to generate text chunks
    - name: Run Script
      run: python speedtesturls.py

    # Step 5: Upload all generated text files as a downloadable zip archive
    - name: Upload Output Chunks
      uses: actions/upload-artifact@v4
      with:
        name: text-file-chunks # The name of the downloadable zip file
        path: output_chunks/   # Target the entire folder containing the files
        retention-days: 5      # Automatically deletes the files from GitHub after 5 days to save space
